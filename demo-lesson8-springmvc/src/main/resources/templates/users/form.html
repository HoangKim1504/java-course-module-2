<!-- Mục đích: form dùng chung cho tạo mới và sửa (phân biệt qua biến isEdit), có upload avatar.
Điểm cốt lõi là binding form ↔ object bằng th:object + th:field và hiển thị lỗi validation bằng th:errors.-->

<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${isEdit} ? 'Sửa User' : 'Thêm User')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main>
    <h1 th:text="${isEdit} ? 'Sửa User' : 'Thêm User mới'">Form</h1>
    <p class="error" th:if="${uploadError}" th:text="${uploadError}"></p>

    <!--
        - th:object="${user}" gắn form với object user Controller đưa vào Model.
        - th:action đổi URL theo isEdit: sửa → POST /users/{id}, tạo → POST /users.
    -->
    <form th:action="${isEdit} ? @{/users/{id}(id=${user.id})} : @{/users}"
        th:object="${user}"
        method="post"
        enctype="multipart/form-data">

        <!--
            - Mỗi field text lặp lại theo mẫu này (firstName, lastName, email, phone)
            - th:field="*{email}" tự sinh name, id, value và đổ giá trị 2 chiều.
        -->
        <div>
            <label>Họ:</label>
            <input type="text" th:field="*{firstName}"/>
            <p class="error" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></p>
        </div>
        <div>
            <label>Tên:</label>
            <input type="text" th:field="*{lastName}"/>
            <p class="error" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></p>
        </div>
        <div>
            <label>Email:</label>
            <input type="email" th:field="*{email}"/>
            <p class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
        </div>
        <div>
            <label>Điện thoại:</label>
            <input type="text" th:field="*{phone}"/>
            <p class="error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></p>
        </div>
        <div>
            <label>Avatar:</label>
            <!-- File avatar KHÔNG dùng th:field; chỉ dùng name khớp @RequestParam -->
            <input type="file" name="avatar" accept="image/*"/>
            <p th:if="${!#strings.isEmpty(user.avatarUrl)}">
                Ảnh hiện tại:
                <img th:src="${user.avatarUrl}" width="64" height="64" class="avatar" alt="current"/>
            </p>
        </div>

        <button type="submit" th:text="${isEdit} ? 'Cập nhật' : 'Tạo mới'">Submit</button>
        <a th:href="@{/users}">Hủy</a>
    </form>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
